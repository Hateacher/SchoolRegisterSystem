spring.application.name=SchoolRegisterSystem

spring.datasource.url=jdbc:mysql://localhost:3306/school_register?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis：下划线列名自动映射驼峰属性（SQL 中同时使用了列别名，双保险）
mybatis.configuration.map-underscore-to-camel-case=true
# 控制台打印 SQL，便于联调与演示（正式演示可注释掉）
logging.level.com.login.schoolregistersystem.mapper=debug